---
- name: Mina's local machine bootstrap
  hosts: localhost
  connection: local
  gather_facts: yes

  # IMPORTANT: don't become at the play level so $HOME stays your user.
  become: false

  vars:
    # Resolve your actual user/home even if some tasks escalate later.
    target_user: "{{ lookup('env','USER') }}"
    target_home: "{{ lookup('env','HOME') }}"
    target_group: "{{ lookup('pipe', 'id -gn') }}"

    # Tooling versions/paths
    tpm_dir: "{{ target_home }}/.config/tmux/plugins/tpm"
    nvm_version: "v0.39.7"
    node_lts: "lts/*"

  pre_tasks:
    - name: Refuse to bootstrap root by accident
      ansible.builtin.assert:
        that:
          - target_user != "root"
          - target_home != "/root"
        fail_msg: "Run this playbook as your normal user with ansible-playbook -K local.yml, not with sudo ansible-playbook."

    - name: Show who/where we are installing to
      ansible.builtin.debug:
        msg:
          - "user: {{ target_user }}"
          - "group: {{ target_group }}"
          - "home: {{ target_home }}"

  tasks:
    # Common base (inside this file, use become: yes only where needed)
    - name: Common base
      ansible.builtin.include_tasks: "tasks/common.yml"

    - name: Create SSH key
      ansible.builtin.include_tasks: "tasks/ssh.yml"

    - name: Install fonts
      ansible.builtin.include_tasks: "tasks/fonts.yml"

    - name: Install kitty terminal
      ansible.builtin.include_tasks: "tasks/kitty.yml"

    - name: Install tmux and TPM
      ansible.builtin.include_tasks: "tasks/tmux.yml"

    # Language/tool modules (auto-include everything in langs/)
    - name: Include all language setup files from langs/
      ansible.builtin.include_tasks: "{{ item }}"
      loop: "{{ lookup('fileglob', playbook_dir + '/langs/*.yml', wantlist=True) | sort }}"
      loop_control:
        label: "{{ item | basename }}"

    # Neovim (split out if you want)
    - name: Install Neovim and friends
      ansible.builtin.include_tasks: "tasks/neovim.yml"
