---
# Base packages & utilities
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install common packages
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - curl
      - unzip
      - htop
      - ripgrep
      - ca-certificates
      - tmux
      - python3
      - python3-pip
      - jq
      - fzf
      - tar
      - gzip
      - tree
      - tree-sitter-cli
      - git-delta
    state: present
  become: yes
