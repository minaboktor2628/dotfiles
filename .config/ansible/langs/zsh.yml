---
- name: Ensure base deps
  become: yes
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
    state: present
    update_cache: yes

# Change default shell (kept separate from installer script)
- name: Set default shell to zsh for {{ target_user }}
  become: yes
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh

- name: Ensure zsh plugin directories exist
  become: yes
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ target_home }}/.local/share/zsh/plugins"
    - "{{ target_home }}/.config/zsh/plugins"

- name: Install standalone zsh plugins
  become: yes
  become_user: "{{ target_user }}"
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ target_home }}/.local/share/zsh/plugins/{{ item.name }}"
    version: master
    update: yes
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git

- name: Show zsh plugin locations
  ansible.builtin.debug:
    msg:
      - "Put tracked custom plugin files in {{ target_home }}/.config/zsh/plugins"
      - "Standalone cloned repos live in {{ target_home }}/.local/share/zsh/plugins"
